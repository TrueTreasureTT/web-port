
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doom II</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#121212;font-family:Arial,sans-serif}
#library{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#play{position:relative;width:360px;height:200px;padding:0;border:0;border-radius:20px;overflow:hidden;cursor:pointer;background:#222;color:#fff;box-shadow:0 8px 20px #0008}
#play img{width:100%;height:100%;object-fit:cover;display:block}
#play span{position:absolute;inset:0;display:flex;align-items:flex-end;padding:20px;background:linear-gradient(transparent,#000d);font-size:24px;font-weight:bold}
#game{display:none;position:fixed;inset:0;background:#000}
#game.active{display:block}
#canvas{display:block;width:100%;height:100%;background:#000}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:20px;background:#000;z-index:2}
</style>
</head>
<body>
<div id="library">
<button id="play" type="button" aria-label="Play Doom II">
<img src="https://play-lh.googleusercontent.com/VrGId-TYaL82FXTvurH1zpHC7vwgDf0F_IexPjIiITD_oasfcESvec5kV-83WpsRrVCMNxjfTvDnpFFJBXHGWQ" alt="Doom II">
<span>Doom II — Click to Play</span>
</button>
</div>
<div id="game">
<div id="loading">Click detected. Loading Doom II…</div>
<canvas id="canvas" tabindex="0"></canvas>
</div>
<script src="launcher.js"></script>
</body>
</html>
